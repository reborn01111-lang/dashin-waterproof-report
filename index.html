<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>大信防水｜成本控制計算</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--good:#166534;--bad:#b91c1c;--soft:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.app{max-width:720px;margin:0 auto;padding:14px 14px 112px}
.header{position:static;padding:4px 0 8px}
.brand{background:#111827;color:white;border-radius:16px;padding:10px;text-align:center}
.brand-logo{display:block;max-width:230px;width:72%;height:auto;margin:0 auto 6px;background:#fff;border-radius:10px;padding:5px}
.brand h1{font-size:20px;margin:0 0 2px;font-weight:900}
.brand p{margin:0;color:#d1d5db;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px}
.card h2{font-size:18px;margin:0 0 12px}
label{display:block;font-weight:800;font-size:14px;margin-top:12px}
input,textarea,select,button{font:inherit}
input,textarea,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:13px;background:white;padding:13px 14px;min-height:50px;font-size:16px;outline:none}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:#111827;box-shadow:0 0 0 2px #e5e7eb}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr 46px;gap:8px;align-items:end;margin-top:10px}
.small{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}
.btn{border:0;border-radius:13px;min-height:48px;padding:0 15px;font-weight:900;cursor:pointer}
.btn-dark{background:#111827;color:#fff}
.btn-light{background:#e5e7eb;color:#111827}
.btn-danger{background:#fee2e2;color:#991b1b}
.btn-full{width:100%;margin-top:10px}
.remove{height:50px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:24px}
.quick-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:800}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff}
.kpi span{display:block;color:var(--muted);font-size:13px;font-weight:700}
.kpi strong{display:block;font-size:21px;margin-top:4px}
.kpi.profit{grid-column:1/-1;background:#f9fafb;border-width:2px}
.preview{white-space:pre-wrap;background:#f9fafb;border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.65;font-size:15px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photo{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#f3f4f6}
.photo img{width:100%;height:100%;object-fit:cover}
.photo button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:30px;height:30px;background:rgba(0,0,0,.65);color:#fff;font-size:18px}
.month-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px}
.stat span{display:block;color:var(--muted);font-size:12px;font-weight:700}
.stat b{display:block;font-size:18px;margin-top:3px}
.history-item{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fff}
.history-item b{display:block;margin-bottom:4px}
.history-meta{font-size:13px;color:var(--muted)}
.history-actions{display:flex;gap:8px;margin-top:10px}
.history-actions button{flex:1}
details{margin-top:10px}
summary{font-weight:900;cursor:pointer;padding:8px 0}
.setting-row{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;margin-top:8px}
.actions{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:10}
.actions-inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2,.grid3{grid-template-columns:1fr}.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}}
</style>
</head>

  <section class="card">
    <h2>工程資料</h2>
    <div class="grid2">
      <label>施工開始日期<input id="startDate" type="date"></label>
      <label>施工完成日期<input id="endDate" type="date"></label>
    </div>

    <label>工地快速選單
      <select id="siteSelect"><option value="">請選擇工地</option></select>
    </label>
<label>施工項目快速選單
      <select id="projectSelect"><option value="">請選擇施工項目</option></select>
    </label>
<label>位置<input id="location" placeholder="例如：1F 店鋪／A棟屋頂"></label>

    <div class="grid3">
      <label>數量<input id="qty" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
      <label>單位
        <select id="unit">
          <option>㎡</option><option>m</option><option>式</option><option>處</option><option>組</option><option>支</option><option>才</option>
        </select>
      </label>
      <label>單價<input id="unitPrice" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
    </div>
    <div class="small">選擇施工項目後，若「單價表」已有設定，會自動帶入單價。</div>
</section>

  <section class="card">
    <h2>員工工資</h2>
    <div id="employeeQuick" class="quick-list"></div>
    <div class="small">點員工姓名可快速加入；工資仍可手動修改。</div>
    <div id="employeeList"></div>
    <button type="button" class="btn btn-light btn-full" id="addEmployee">＋ 新增員工工資</button>
  </section>
<section class="card">
    <h2>即時計算</h2>
    <div class="summary">
      <div class="kpi"><span>工程收入</span><strong id="income">$0</strong></div>
      <div class="kpi"><span>員工工資</span><strong id="wages">$0</strong></div>
      <div class="kpi"><span>獲利率</span><strong id="margin">0%</strong></div>
      <div class="kpi profit"><span>實際獲利</span><strong id="profit">$0</strong></div>
    </div>
  </section>

  <section class="card">
    <h2>月統計</h2>
    <label>統計月份<input id="statsMonth" type="month"></label>
    <div class="month-stats">
      <div class="stat"><span>回報筆數</span><b id="mCount">0</b></div>
      <div class="stat"><span>工程收入</span><b id="mIncome">$0</b></div>
      <div class="stat"><span>員工工資</span><b id="mWages">$0</b></div>
      <div class="stat"><span>實際獲利</span><b id="mProfit">$0</b></div>
    </div>
  </section>

  <section class="card">
    <h2>LINE 回報預覽</h2>
    <div id="preview" class="preview"></div>
    <button class="btn btn-dark btn-full" id="copyReport">複製 LINE 回報文字</button>
  </section>

  <section class="card">
    <h2>快速設定</h2>
    <details>
      <summary>工地名單設定</summary>
      <div id="siteSettings"></div>
      <button class="btn btn-light btn-full" id="addSiteSetting">＋ 新增工地</button>
    </details>
    <details>
      <summary>施工項目／單價表設定</summary>
      <div id="priceSettings"></div>
      <button class="btn btn-light btn-full" id="addPriceSetting">＋ 新增項目單價</button>
    </details>
    <details>
      <summary>員工名單設定</summary>
      <div id="employeeSettings"></div>
      <button class="btn btn-light btn-full" id="addEmployeeSetting">＋ 新增員工</button>
    </details>
    <button class="btn btn-dark btn-full" id="saveSettings">儲存設定</button>
    <div class="small">設定只需輸入一次，之後此手機會記住。</div>
  </section>

  <section class="card">
    <h2>歷史查詢與匯出</h2>
    <label>搜尋<input id="historySearch" placeholder="工地／施工項目"></label>
    <button class="btn btn-dark btn-full" id="exportCsv">匯出 CSV</button>
    <div class="small">可用 Excel 開啟，方便做月報與對帳。</div>
  </section>

  <section class="card">
    <h2>歷史紀錄</h2>
    <div id="history"></div>
  </section>
</div>

<div class="actions">
  <div class="actions-inner">
    <button class="btn btn-light" id="clearAll">清空本頁</button>
    <button class="btn btn-dark" id="saveReport">儲存回報</button>
  </div>
</div>

var settings=loadSettings();

function loadSettings(){
  try{
    var s=JSON.parse(localStorage.getItem('dashin_settings')||'null');
    if(!s) return JSON.parse(JSON.stringify(defaultSettings));
    if(!Array.isArray(s.sites)) s.sites=[];
    if(!Array.isArray(s.prices)) s.prices=[];
    if(!Array.isArray(s.employees)) s.employees=[];
    var existing={};
    s.prices.forEach(function(x){ if(x&&x.name) existing[x.name]=true; });
    defaultSettings.prices.forEach(function(x){
      if(!existing[x.name]) s.prices.push({name:x.name,price:x.price});
    });
    return s;
  }catch(e){return JSON.parse(JSON.stringify(defaultSettings))}
}
function saveSettingsData(){localStorage.setItem('dashin_settings',JSON.stringify(settings))}

function refreshQuickLists(){
  var ss=$('siteSelect'); ss.innerHTML='<option value="">請選擇工地</option>';
  settings.sites.forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x;ss.appendChild(o)});

  var ps=$('projectSelect'); ps.innerHTML='<option value="">請選擇施工項目</option>';
  settings.prices.forEach(function(x){var o=document.createElement('option');o.value=x.name;o.textContent=x.name;ps.appendChild(o)});

  var eq=$('employeeQuick'); eq.innerHTML='';
  if(!settings.employees.length){eq.innerHTML='<span class="small">尚未設定員工名單</span>'}
  settings.employees.forEach(function(name){
    var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=name;
    b.onclick=function(){createEmployee(name,'')};
    eq.appendChild(b);
  });
}

function createEmployee(name,wage){
  name=name||''; wage=(wage===undefined||wage===null)?'':wage;
  var row=document.createElement('div');row.className='row';
  var n=document.createElement('input');n.className='emp-name';n.type='text';n.placeholder='員工姓名';n.value=name;
  var w=document.createElement('input');w.className='emp-wage';w.type='text';w.inputMode='numeric';w.pattern='[0-9]*';w.placeholder='本次工資';w.value=wage;
  var d=document.createElement('button');d.type='button';d.className='remove';d.textContent='×';
  n.oninput=calc;w.oninput=calc;d.onclick=function(){row.remove();calc()};
  row.appendChild(n);row.appendChild(w);row.appendChild(d);$('employeeList').appendChild(row);calc();
}
function getEmployees(){
  return Array.prototype.slice.call(document.querySelectorAll('#employeeList .row')).map(function(r){
    return {name:r.querySelector('.emp-name').value.trim(),wage:num(r.querySelector('.emp-wage').value)}
  }).filter(function(x){return x.name||x.wage});
}
function getData(){
  return {
    id:Date.now(),startDate:$('startDate').value,endDate:$('endDate').value,
    site:$('siteSelect').value,project:$('projectSelect').value,location:$('location').value.trim(),
    qty:num($('qty').value),unit:$('unit').value,unitPrice:num($('unitPrice').value),
    note:'',employees:getEmployees()
  };
}
function totals(d){
  d=d||getData();var income=d.qty*d.unitPrice;
  var wages=(d.employees||[]).reduce(function(s,x){return s+num(x.wage)},0);
  var profit=income-wages;var margin=income>0?(profit/income*100):0;return {income:income,wages:wages,profit:profit,margin:margin};
}
function buildReport(d){
  d=d||getData();var t=totals(d);
  var e=(d.employees||[]).length?(d.employees||[]).map(function(x){return '• '+(x.name||'未命名')+'：'+money(x.wage)}).join('\n'):'• 無';
  return '【大信防水｜成本控制計算】\n'+
    '施工日期：'+(d.startDate||'—')+' ～ '+(d.endDate||'—')+'\n'+
    '工地：'+(d.site||'—')+'\n項目：'+(d.project||'—')+'\n位置：'+(d.location||'—')+'\n\n'+
    '數量：'+d.qty+' '+(d.unit||'')+'\n單價：'+money(d.unitPrice)+'\n工程收入：'+money(t.income)+'\n\n'+
    '【員工工資】\n'+e+'\n人工成本：'+money(t.wages)+'\n\n實際獲利：'+money(t.profit)+'\n獲利率：'+t.margin.toFixed(1)+'%';
}
function calc(){
  var t=totals();$('income').textContent=money(t.income);$('wages').textContent=money(t.wages);$('profit').textContent=money(t.profit);
  $('margin').textContent=t.margin.toFixed(1)+'%';$('profit').style.color=t.profit<0?'#b91c1c':'#166534';$('preview').textContent=buildReport();
}

$('siteSelect').onchange=function(){calc()};
$('projectSelect').onchange=function(){
  if(this.value){
    var p=settings.prices.find(function(x){return x.name===$('projectSelect').value});
    if(p && num(p.price)>0)$('unitPrice').value=p.price;
  }
  calc();
};
['startDate','endDate','location','qty','unit','unitPrice'].forEach(function(id){$(id).oninput=calc});
$('addEmployee').onclick=function(){createEmployee('','')};


function getHistory(){try{return JSON.parse(localStorage.getItem('dashin_reports')||'[]')}catch(e){return []}}
function saveHistory(arr){localStorage.setItem('dashin_reports',JSON.stringify(arr))}
function loadHistory(){
  var arr=getHistory(),box=$('history');box.innerHTML='';
  var q=($('historySearch')?$('historySearch').value.trim().toLowerCase():'');
  arr=arr.filter(function(d){var text=((d.site||'')+' '+(d.project||'')).toLowerCase();return !q||text.indexOf(q)>=0;});
  if(!arr.length){box.innerHTML='<div class="small">目前尚無儲存紀錄。</div>';refreshMonthStats();return}
  arr.forEach(function(d){
    var t=totals(d),div=document.createElement('div');div.className='history-item';
    div.innerHTML='<b>'+(d.site||'未命名工地')+'｜'+(d.project||'未填項目')+'</b>'+
      '<div class="history-meta">'+(d.startDate||'—')+' ～ '+(d.endDate||'—')+'｜獲利 '+money(t.profit)+'</div>'+
      '<div class="history-actions"><button class="btn btn-light load">載入</button><button class="btn btn-danger del">刪除</button></div>';
    div.querySelector('.load').onclick=function(){loadReport(d)};
    div.querySelector('.del').onclick=function(){if(confirm('確定刪除此筆紀錄？')){saveHistory(arr.filter(function(x){return x.id!==d.id}));loadHistory()}};
    box.appendChild(div);
  });
  refreshMonthStats();
}
function loadReport(d){
  ['startDate','endDate','location','qty','unit','unitPrice'].forEach(function(id){$(id).value=(d[id]===undefined||d[id]===null)?'':d[id]});
  $('employeeList').innerHTML='';(d.employees||[]).forEach(function(x){createEmployee(x.name,x.wage)});
  if(!(d.employees||[]).length)createEmployee('','');
  calc();window.scrollTo({top:0,behavior:'smooth'});
}
$('saveReport').onclick=function(){
  var d=getData(),arr=getHistory();
  try{arr.unshift(d);saveHistory(arr.slice(0,100));loadHistory();alert('工程回報已儲存。')}
  catch(e){alert('儲存失敗：照片可能太多。請刪除部分照片後再試。')}
};
$('clearAll').onclick=function(){
  if(!confirm('確定清空目前輸入內容？'))return;
  ['startDate','endDate','location','qty','unitPrice'].forEach(function(id){$(id).value=''});
  $('siteSelect').value='';$('projectSelect').value='';$('employeeList').innerHTML='';createEmployee('','');calc();
};
$('copyReport').onclick=function(){
  var text=buildReport();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){alert('已複製，可直接貼到 LINE。')})}
  else{prompt('請長按複製以下內容：',text)}
};

function refreshMonthStats(){
  var m=$('statsMonth').value;
  var arr=getHistory().filter(function(d){return m && (d.startDate||'').slice(0,7)===m});
  var ti={income:0,wages:0,profit:0};
  arr.forEach(function(d){var t=totals(d);ti.income+=t.income;ti.wages+=t.wages;ti.profit+=t.profit});
  $('mCount').textContent=arr.length;$('mIncome').textContent=money(ti.income);$('mWages').textContent=money(ti.wages);$('mProfit').textContent=money(ti.profit);
  $('mProfit').style.color=ti.profit<0?'#b91c1c':'#166534';
}
$('statsMonth').onchange=refreshMonthStats;

function addSettingRow(container,a,b,type){
  var row=document.createElement('div');row.className='setting-row';
  var i1=document.createElement('input');i1.value=a||'';i1.placeholder=type==='price'?'施工項目':'名稱';
  var i2=document.createElement('input');i2.value=b||'';i2.placeholder=type==='price'?'單價':'可留空';i2.style.display=type==='price'?'block':'none';
  var del=document.createElement('button');del.type='button';del.className='remove';del.textContent='×';del.onclick=function(){row.remove()};
  row.appendChild(i1);row.appendChild(i2);row.appendChild(del);container.appendChild(row);
}
function renderSettings(){
  $('siteSettings').innerHTML='';settings.sites.forEach(function(x){addSettingRow($('siteSettings'),x,'','name')});
  $('priceSettings').innerHTML='';settings.prices.forEach(function(x){addSettingRow($('priceSettings'),x.name,x.price,'price')});
  $('employeeSettings').innerHTML='';settings.employees.forEach(function(x){addSettingRow($('employeeSettings'),x,'','name')});
}
$('addSiteSetting').onclick=function(){addSettingRow($('siteSettings'),'','','name')};
$('addPriceSetting').onclick=function(){addSettingRow($('priceSettings'),'','','price')};
$('addEmployeeSetting').onclick=function(){addSettingRow($('employeeSettings'),'','','name')};
$('saveSettings').onclick=function(){
  settings.sites=Array.prototype.slice.call($('siteSettings').querySelectorAll('.setting-row')).map(function(r){return r.children[0].value.trim()}).filter(Boolean);
  settings.prices=Array.prototype.slice.call($('priceSettings').querySelectorAll('.setting-row')).map(function(r){return {name:r.children[0].value.trim(),price:num(r.children[1].value)}}).filter(function(x){return x.name});
  settings.employees=Array.prototype.slice.call($('employeeSettings').querySelectorAll('.setting-row')).map(function(r){return r.children[0].value.trim()}).filter(Boolean);
  saveSettingsData();refreshQuickLists();alert('設定已儲存。');
};


$('historySearch').oninput=loadHistory;

function csvSafe(v){
  v=(v===undefined||v===null)?'':String(v);
  return '"'+v.replace(/"/g,'""')+'"';
}
$('exportCsv').onclick=function(){
  var arr=getHistory();
  if(!arr.length){alert('目前沒有可匯出的歷史紀錄。');return}
  var rows=[['日期','工地','施工項目','位置','數量','單位','單價','工程收入','員工工資','實際獲利','獲利率']];
  arr.forEach(function(d){
    var t=totals(d);
    rows.push([d.startDate||'',d.site||'',d.project||'',d.location||'',d.qty||0,d.unit||'',d.unitPrice||0,t.income,t.wages,t.profit,t.margin.toFixed(1)+'%']);
  });
  var csv='\uFEFF'+rows.map(function(r){return r.map(csvSafe).join(',')}).join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='大信防水成本控制_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);
};

(function init(){
  refreshQuickLists();renderSettings();createEmployee('','');
  var now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');$('statsMonth').value=ym;
  calc();loadHistory();
})();
