<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>大信防水｜成本控制計算</title>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;
  --accent:#111827;--good:#166534;--bad:#b91c1c;--soft:#e5e7eb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.app{max-width:680px;margin:0 auto;padding:14px 14px 110px}
.header{position:sticky;top:0;z-index:5;background:rgba(243,244,246,.94);backdrop-filter:blur(8px);padding:10px 0 12px}
.brand{background:#111827;color:white;border-radius:18px;padding:16px}
.brand h1{font-size:22px;margin:0 0 4px;font-weight:900}
.brand p{margin:0;color:#d1d5db;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px}
.card h2{font-size:18px;margin:0 0 12px}
label{display:block;font-weight:700;font-size:14px;margin-top:12px}
input,textarea,select,button{font:inherit}
input,textarea,select{
  width:100%;margin-top:6px;border:1px solid var(--line);border-radius:13px;background:white;
  padding:13px 14px;min-height:50px;font-size:16px;outline:none
}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:#111827;box-shadow:0 0 0 2px #e5e7eb}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr 46px;gap:8px;align-items:end;margin-top:10px}
.emp-block{display:block}
.emp-block span{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.emp-name,.emp-wage{display:block;width:100%;min-height:54px;margin-top:0!important;pointer-events:auto!important;touch-action:manipulation;background:#fff!important;position:relative;z-index:1}
.emp-wage{font-size:18px!important;font-weight:900}
.small{font-size:12px;color:var(--muted);margin-top:5px}
.btn{border:0;border-radius:13px;min-height:48px;padding:0 15px;font-weight:800;cursor:pointer}
.btn-dark{background:#111827;color:white}
.btn-light{background:#e5e7eb;color:#111827}
.btn-danger{background:#fee2e2;color:#991b1b}
.btn-full{width:100%;margin-top:10px}
.remove{height:50px;border:1px solid var(--line);border-radius:13px;background:white;font-size:24px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff}
.kpi span{display:block;color:var(--muted);font-size:13px;font-weight:700}
.kpi strong{display:block;font-size:21px;margin-top:4px}
.kpi.profit{grid-column:1/-1;background:#f9fafb;border-width:2px}
.preview{white-space:pre-wrap;background:#f9fafb;border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.65;font-size:15px}
.actions{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:10}
.actions-inner{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.history-item{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fff}
.history-item b{display:block;margin-bottom:4px}
.history-meta{font-size:13px;color:var(--muted)}
.history-actions{display:flex;gap:8px;margin-top:10px}
.history-actions button{flex:1}
@media(max-width:520px){
  .grid2{grid-template-columns:1fr}
  .row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}
  .summary{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">
      <h1>成本控制計算</h1>
      <p>大信防水｜工程紀錄・手動工資・獲利・LINE 回報</p>
    </div>
  </div>


  <section class="card">
    <h2>使用方式</h2>
    <div class="small" style="font-size:14px;line-height:1.6">
      將此 HTML 檔直接傳給同事，每個人用手機瀏覽器開啟即可使用。<br>
      每位使用者的歷史紀錄只會儲存在自己的手機瀏覽器，不會同步到其他人的手機。
    </div>
  </section>

  <section class="card">
    <h2>工程資料</h2>
    <div class="grid2">
      <label>施工開始日期<input id="startDate" type="date"></label>
      <label>施工完成日期<input id="endDate" type="date"></label>
    </div>
    <label>工地<input id="site" placeholder="例如：三本大序"></label>
    <label>項目<input id="project" placeholder="例如：管道間防水"></label>
    <label>位置<input id="location" placeholder="例如：1F 店鋪"></label>
    <div class="grid2">
      <label>數量<input id="qty" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
      <label>單價<input id="unitPrice" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
    </div>
    <label>備註<textarea id="note" placeholder="施工狀況、追加事項、待處理問題…"></textarea></label>
  </section>

  <section class="card">
    <h2>員工工資</h2>
    <div id="employeeList"></div>
    <button type="button" class="btn btn-light btn-full" id="addEmployee" onclick="createEmployee(); return false;">＋ 新增員工工資</button>
    <div class="small">員工姓名與本次工資皆由現場手動輸入，可新增多人。</div>
  </section>

  <section class="card">
    <h2>即時計算</h2>
    <div class="summary">
      <div class="kpi"><span>工程收入</span><strong id="income">$0</strong></div>
      <div class="kpi"><span>員工工資</span><strong id="wages">$0</strong></div>
      <div class="kpi profit"><span>實際獲利</span><strong id="profit">$0</strong></div>
    </div>
  </section>

  <section class="card">
    <h2>LINE 回報預覽</h2>
    <div id="preview" class="preview"></div>
    <button class="btn btn-dark btn-full" id="copyReport">複製 LINE 回報文字</button>
  </section>

  <section class="card">
    <h2>歷史紀錄</h2>
    <div id="history"></div>
  </section>

  <div class="actions">
    <div class="actions-inner">
      <button class="btn btn-light" id="clearAll">清空本頁</button>
      <button class="btn btn-dark" id="saveReport">儲存回報</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const money = v => new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(v)||0);
const num = v => Math.max(0, Number(v)||0);

function createEmployee(name='', wage=''){
  const list = document.getElementById('employeeList');
  if(!list) return;

  const row = document.createElement('div');
  row.className = 'row';

  const nameWrap = document.createElement('div');
  nameWrap.className = 'emp-block';
  const nameLabel = document.createElement('span');
  nameLabel.textContent = '姓名';
  const nameInput = document.createElement('input');
  nameInput.className = 'emp-name';
  nameInput.type = 'text';
  nameInput.autocomplete = 'off';
  nameInput.placeholder = '員工姓名';
  nameInput.value = name || '';

  const wageWrap = document.createElement('div');
  wageWrap.className = 'emp-block';
  const wageLabel = document.createElement('span');
  wageLabel.textContent = '本次工資';
  const wageInput = document.createElement('input');
  wageInput.className = 'emp-wage';
  wageInput.type = 'text';
  wageInput.inputMode = 'numeric';
  wageInput.pattern = '[0-9]*';
  wageInput.autocomplete = 'off';
  wageInput.placeholder = '例如 2500';
  wageInput.value = (wage === undefined || wage === null) ? '' : wage;

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'remove';
  del.setAttribute('aria-label','刪除員工');
  del.textContent = '×';

  nameWrap.append(nameLabel, nameInput);
  wageWrap.append(wageLabel, wageInput);
  row.append(nameWrap, wageWrap, del);
  list.appendChild(row);

  nameInput.addEventListener('input', calc);
  wageInput.addEventListener('input', calc);
  wageInput.addEventListener('blur', calc);
  del.addEventListener('click', ()=>{
    row.remove();
    calc();
  });

  calc();
}
function getEmployees(){
  return [...document.querySelectorAll('#employeeList .row')].map(r=>({
    name:r.querySelector('.emp-name').value.trim(),
    wage:num(r.querySelector('.emp-wage').value)
  })).filter(x=>x.name||x.wage);
}
function getData(){
  return {
    id: Date.now(),
    startDate:$('startDate').value,endDate:$('endDate').value,
    site:$('site').value.trim(),project:$('project').value.trim(),location:$('location').value.trim(),
    qty:num($('qty').value),unitPrice:num($('unitPrice').value),note:$('note').value.trim(),
    employees:getEmployees()
  };
}
function totals(d=getData()){
  const income=d.qty*d.unitPrice;
  const wages=d.employees.reduce((s,x)=>s+x.wage,0);
  return {income,wages,profit:income-wages};
}
function fmtDate(v){ return v||'—'; }
function buildReport(d=getData()){
  const t=totals(d);
  let e=d.employees.length?d.employees.map(x=>`• ${x.name||'未命名'}：${money(x.wage)}`).join('\n'):'• 無';
  return `【大信防水工程回報】
施工日期：${fmtDate(d.startDate)} ～ ${fmtDate(d.endDate)}
工地：${d.site||'—'}
項目：${d.project||'—'}
位置：${d.location||'—'}

數量：${d.qty}
單價：${money(d.unitPrice)}
工程收入：${money(t.income)}

【員工工資】
${e}
人工成本：${money(t.wages)}

實際獲利：${money(t.profit)}

備註：${d.note||'—'}`;
}
function calc(){
  const t=totals();
  $('income').textContent=money(t.income);
  $('wages').textContent=money(t.wages);
  $('profit').textContent=money(t.profit);
  $('profit').style.color=t.profit<0?'#b91c1c':'#166534';
  $('preview').textContent=buildReport();
}
['startDate','endDate','site','project','location','qty','unitPrice','note'].forEach(id=>$(id).addEventListener('input',calc));
$('copyReport').onclick=async()=>{
  const text=buildReport();
  try{
    await navigator.clipboard.writeText(text);
    alert('已複製，可直接貼到 LINE 群組。');
  }catch(e){
    prompt('請長按複製以下內容：',text);
  }
};

function loadHistory(){
  const arr=JSON.parse(localStorage.getItem('dashin_reports')||'[]');
  const box=$('history'); box.innerHTML='';
  if(!arr.length){box.innerHTML='<div class="small">目前尚無儲存紀錄。</div>';return}
  arr.forEach(d=>{
    const t=totals(d);
    const div=document.createElement('div'); div.className='history-item';
    div.innerHTML=`<b>${d.site||'未命名工地'}｜${d.project||'未填項目'}</b>
      <div class="history-meta">${d.startDate||'—'} ～ ${d.endDate||'—'}｜獲利 ${money(t.profit)}</div>
      <div class="history-actions">
        <button class="btn btn-light load">載入</button>
        <button class="btn btn-danger del">刪除</button>
      </div>`;
    div.querySelector('.load').onclick=()=>loadReport(d);
    div.querySelector('.del').onclick=()=>{
      const next=arr.filter(x=>x.id!==d.id);
      localStorage.setItem('dashin_reports',JSON.stringify(next)); loadHistory();
    };
    box.appendChild(div);
  });
}
function loadReport(d){
  $('startDate').value=d.startDate||'';$('endDate').value=d.endDate||'';
  $('site').value=d.site||'';$('project').value=d.project||'';$('location').value=d.location||'';
  $('qty').value=d.qty||'';$('unitPrice').value=d.unitPrice||'';$('note').value=d.note||'';
  $('employeeList').innerHTML='';(d.employees||[]).forEach(x=>createEmployee(x.name,x.wage));
  if(!(d.employees||[]).length) createEmployee();
  calc(); window.scrollTo({top:0,behavior:'smooth'});
}
$('saveReport').onclick=()=>{
  const d=getData();
  const arr=JSON.parse(localStorage.getItem('dashin_reports')||'[]');
  arr.unshift(d);
  localStorage.setItem('dashin_reports',JSON.stringify(arr.slice(0,100)));
  loadHistory(); alert('工程回報已儲存在此手機瀏覽器。');
};
$('clearAll').onclick=()=>{
  if(!confirm('確定清空目前輸入內容？')) return;
  ['startDate','endDate','site','project','location','qty','unitPrice','note'].forEach(id=>$(id).value='');
  $('employeeList').innerHTML='';
  createEmployee(); calc();
};

if(document.getElementById('employeeList') && document.getElementById('employeeList').children.length===0){
  createEmployee();
}
calc();
loadHistory();
</script>
</body>
</html>
