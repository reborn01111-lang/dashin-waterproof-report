<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B63B6">
<title>包工成控</title>
<style>
body{margin:0;background:#eef8fb;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#0f172a}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.card{max-width:420px;width:100%;background:#fff;border:1px solid #b9d7e5;border-radius:22px;padding:28px;text-align:center;box-shadow:0 14px 35px rgba(11,99,182,.12)}
.logo{width:92px;height:92px;border-radius:24px;margin:0 auto 18px;background:linear-gradient(135deg,#0B63B6,#49D6D2);color:#fff;display:grid;place-items:center;font-weight:900;font-size:28px}
h1{font-size:22px;margin:0 0 8px;color:#084C8D}
p{line-height:1.6;color:#475569}
button{border:0;border-radius:999px;padding:12px 18px;font-weight:900;color:#fff;background:linear-gradient(135deg,#0B63B6,#49D6D2)}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="logo">大信</div>
<h1>目前離線</h1>
<p>若是第一次使用，請先連網開啟一次 App 完成快取。完成後即可離線使用。</p>
<button onclick="location.href='/index.html'">重新開啟 App</button>
</div></div>
</body>
</html>
